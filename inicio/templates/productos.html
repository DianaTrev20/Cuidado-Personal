<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .productos_contenedor
        {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: flex-start;
            gap: 25px;
        }
        .producto_item
        {
            width: 250px;
            height: 400px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .producto_item img
        {
            width: 100%;
            max-height: 200px;
        }
    </style>
</head>
<body>

    <div class="productos_contenedor">
        {% for producto in productos %}

        <a href="http://localhost:8000/producto/{{ producto.id }}">
            <div class="producto_item">
                <img src="{{ producto.imagen }}" alt="">
            
                <p>Nombre: {{ producto.nombre }}</p>
                <p>Precio: {{ producto.precio.precio }}</p>

                <p>Departamento: {{ producto.departamento.nombre }}</p>

                

                <p>Proveedor: {{  producto.proveedor.nombre }}</p>
            </div>
        </a>


        
        {% endfor %}
    </div>
    
</body>
</html>
