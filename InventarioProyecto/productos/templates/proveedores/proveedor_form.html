{% extends 'productos/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                
                <div class="text-center mb-4">
                    <i class="bi bi-building fs-1 text-primary"></i>
                    {% if form.instance.pk %}
                        <h2 class="fw-bold mt-2">Editar Proveedor</h2>
                    {% else %}
                        <h2 class="fw-bold mt-2">Registrar Proveedor</h2>
                    {% endif %}
                    <p class="text-muted">Ingresa los datos de contacto de la empresa.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar Datos</button>
                        <a href="{% url 'proveedor_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
